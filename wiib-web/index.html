<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <!-- viewport-fit=cover：iOS 装成 PWA 后全屏，需自行让开刘海/底部横条（安全区内边距见 Layout.tsx） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 浏览器里保持品牌橙（安卓 Chrome / iOS Safari 用它染地址栏）；装成 App 后由下方脚本改成顶栏色 -->
    <meta name="theme-color" content="#F97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WIIB" />
    <title>WhatIfIBought</title>
    <script>
      // React/API 尚未启动时先应用上次由服务端确认过的品牌，避免刷新时闪回默认标题。
      window.__wiibInitialSiteName = 'WhatIfIBought';
      try {
        const brand = JSON.parse(localStorage.getItem('wiib-site-settings') || 'null');
        if (brand && typeof brand.siteName === 'string' && brand.siteName.trim()
          && typeof brand.faviconUrl === 'string' && brand.faviconUrl.trim()) {
          document.title = brand.siteName.trim();
          window.__wiibInitialSiteName = brand.siteName.trim();
          const icon = document.querySelector('link[rel~="icon"]');
          if (icon) {
            const iconUrl = new URL(brand.faviconUrl.trim(), location.origin);
            if (iconUrl.origin === location.origin) {
              iconUrl.searchParams.set('wiib_brand', brand.updatedAt || 'default');
            }
            icon.href = iconUrl.href;
          }
        }
      } catch (_) { /* 缓存损坏或不可用时保留静态默认值 */ }
    </script>
    <!-- ===== 开屏动画（网格溶解）=====
         整段必须内联：它要在 bundle 之前就铺满屏幕，晚一步就是白屏。
         配色全部硬编码——index.css 的 token 跟 bundle 一起到，这时候还不存在，
         取值须同 index.css（改主题色记得同步这里） -->
    <style>
      /* 连第一帧都不能白：html 背景先于 splash 元素解析 */
      html { background: #f6f6f4 }
      html.dark { background: #0b0c0f }

      #splash {
        position: fixed; inset: 0; z-index: 9999;
        --c-bg: #f6f6f4; --c-fg: #17181a; --c-line: #e4e4df;
        --c-pri: #f97316; --c-cell: #ececea; --c-mut: #71737b;
      }
      html.dark #splash {
        --c-bg: #0b0c0f; --c-fg: #eceef0; --c-line: #23262e;
        --c-pri: #f97316; --c-cell: #181b21; --c-mut: #878b96;
      }
      /* 溶解一开始就放行点击，别让残留的 1s 挡住首屏操作 */
      #splash.sp-out { pointer-events: none }

      #sp-grid { position: absolute; inset: 0; display: grid }
      /* 只画右边和下边，相邻格不叠成 2px 粗线 */
      .sp-c { background: var(--c-bg); box-shadow: inset -1px -1px 0 var(--c-line) }
      /* 等待态：加载慢时零星格子明暗呼吸，像终端在刷新。
         延迟 1.2s 起——加载快的话根本看不到，不打扰 */
      .sp-c.b { animation: sp-blink 2.4s ease-in-out infinite; animation-delay: calc(1.2s + var(--bd)) }
      @keyframes sp-blink { 0%,100% { background: var(--c-bg) } 50% { background: var(--c-cell) } }
      /* 溶解：写在 blink 之后，同权重后来居上，直接顶掉呼吸 */
      #splash.sp-out .sp-c {
        animation: sp-gone .4s cubic-bezier(.4,0,.3,1) both; animation-delay: var(--d);
      }
      @keyframes sp-gone { to { opacity: 0; transform: scale(.82) } }

      .sp-mid {
        position: absolute; left: 50%; top: 50%; translate: -50% -50%;
        box-sizing: border-box; width: 100%; padding: 0 20px;
        display: flex; flex-direction: column; align-items: center;
        text-align: center; font-family: system-ui, "Microsoft YaHei", sans-serif;
      }
      #splash.sp-out .sp-mid { animation: sp-fade .45s .18s ease both }
      @keyframes sp-fade { to { opacity: 0; transform: translateY(-14px) } }

      /* 任意站点名都用真实文本渲染；字号由内联脚本按字符宽度和视口计算。
         每个字符独立成 span，长名称到最小字号后可以安全换行，不会撑出屏幕。 */
      .sp-brand {
        --sp-brand-size: 56px;
        max-width: min(84vw, 1080px);
        display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline;
        color: var(--c-fg); font-size: var(--sp-brand-size); line-height: .94;
        font-family: "Arial Narrow", "DIN Alternate", system-ui, "Microsoft YaHei", sans-serif;
        font-weight: 800; letter-spacing: .035em; overflow-wrap: anywhere;
      }
      .sp-letter {
        display: inline-block; opacity: 0;
        transform: translateY(.28em) scale(.94); filter: blur(4px);
        animation: sp-letter-in .42s var(--ld) cubic-bezier(.2,.8,.2,1) both;
      }
      .sp-letter.sp-space { width: .32em }
      @keyframes sp-letter-in {
        to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0) }
      }
      .sp-mark {
        color: var(--c-pri); opacity: 0; transform: scale(.2);
        animation: sp-mark-in .3s .62s cubic-bezier(.34,1.56,.64,1) both;
      }
      @keyframes sp-mark-in { to { opacity: 1; transform: scale(1) } }

      .sp-lbl {
        margin-top: 18px; font-size: 10px; letter-spacing: .12em; font-weight: 700;
        color: var(--c-mut); opacity: 0; animation: sp-in .5s .78s ease both;
      }
      .sp-lbl b { color: var(--c-pri) }
      .sp-wide { display: none; font-style: normal }
      @keyframes sp-in { to { opacity: 1 } }

      @media (min-width: 768px) {
        .sp-lbl { margin-top: 22px }
        .sp-wide { display: inline }
      }

      /* 减弱动效：不做逐格溶解和书写，整块淡出即可——但绝不能不显示，
         否则白屏又回来了 */
      @media (prefers-reduced-motion: reduce) {
        .sp-c, #splash.sp-out .sp-c, .sp-letter, .sp-mark, .sp-lbl, #splash.sp-out .sp-mid {
          animation: none !important;
        }
        .sp-letter, .sp-mark { opacity: 1; transform: none; filter: none }
        .sp-lbl { opacity: 1 }
        #splash { transition: opacity .35s ease }
        #splash.sp-out { opacity: 0 }
      }
    </style>
    <script>
      // 阻塞式执行：必须赶在首帧之前定主题，否则暗色用户每次冷启动都要闪一下白
      (function() {
        var dark = localStorage.getItem('theme') === 'dark';
        if (dark) document.documentElement.classList.add('dark');

        // 是否从桌面图标启动：安卓认 display-mode，iOS 只认 navigator.standalone。
        // 打成 html.pwa 供 CSS 用（不走 @media display-mode，iOS 支持度没把握）
        var pwa = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        if (pwa) document.documentElement.classList.add('pwa');

        // 状态栏色：App 内跟顶栏同色才不割裂；浏览器里维持品牌橙。
        // 放这儿是因为晚到 React 挂载会先闪一下旧色。取值须同 index.css 的 --color-card
        if (pwa) {
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#13151a' : '#ffffff');
        }
      })();
    </script>
  </head>
  <body>
    <!-- 开屏放在 #root 前：解析到就上屏，不等 bundle。格子多，交给紧随其后的内联脚本生成 -->
    <div id="splash" aria-hidden="true">
      <div id="sp-grid"></div>
      <div class="sp-mid">
        <div id="sp-brand" class="sp-brand"></div>
        <div class="sp-lbl">GRID ONLINE <b>·</b> <i class="sp-wide">全市场</i>数据接入</div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('splash');
        var grid = document.getElementById('sp-grid');
        var brand = document.getElementById('sp-brand');
        var pc = innerWidth >= 768;   // 768 对齐 index.css 的 md: 断点

        function visualUnits(value) {
          var units = 0;
          Array.from(value).forEach(function (char) {
            if (/\s/.test(char)) units += .32;
            else if (/[\u2e80-\u9fff\uf900-\ufaff]/.test(char)) units += 1;
            else if (/[A-Z0-9]/.test(char)) units += .68;
            else if (/[a-z]/.test(char)) units += .56;
            else units += .45;
          });
          return Math.max(4, units);
        }

        function renderBrand(rawName) {
          var value = typeof rawName === 'string' && rawName.trim()
            ? rawName.trim().replace(/\s+/g, ' ')
            : 'WhatIfIBought';
          var maxWidth = Math.min(innerWidth * .84, 1080);
          var maxSize = innerWidth >= 768 ? 104 : 56;
          var minSize = innerWidth >= 768 ? 30 : 22;
          var size = Math.max(minSize, Math.min(maxSize, maxWidth / visualUnits(value)));
          brand.style.maxWidth = maxWidth + 'px';
          brand.style.setProperty('--sp-brand-size', size.toFixed(2) + 'px');
          brand.replaceChildren();

          var chars = Array.from(value);
          var step = Math.min(.045, .5 / Math.max(1, chars.length));
          chars.forEach(function (char, index) {
            var span = document.createElement('span');
            span.className = 'sp-letter' + (/\s/.test(char) ? ' sp-space' : '');
            span.style.setProperty('--ld', (.16 + index * step).toFixed(3) + 's');
            span.textContent = /\s/.test(char) ? '\u00a0' : char;
            brand.appendChild(span);
          });
          var mark = document.createElement('span');
          mark.className = 'sp-letter sp-mark';
          mark.textContent = '▪';
          brand.appendChild(mark);
        }

        function handleResize() { renderBrand(window.__wiibInitialSiteName || document.title); }
        window.__wiibSetSplashName = function (name) {
          window.__wiibInitialSiteName = name;
          renderBrand(name);
        };
        renderBrand(window.__wiibInitialSiteName || document.title);
        window.addEventListener('resize', handleResize);

        // 格子尽量接近正方：按目标边长反推行列。两头夹住，超宽屏别爆出几百个元素
        var t = pc ? 92 : 66;
        var cols = Math.max(4, Math.min(18, Math.round(innerWidth / t)));
        var rows = Math.max(5, Math.min(12, Math.round(innerHeight / t)));
        grid.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';
        grid.style.gridTemplateRows = 'repeat(' + rows + ',1fr)';

        var buf = '', cx = (cols - 1) / 2, cy = (rows - 1) / 2;
        for (var r = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++) {
            // 宽屏从中心向外辐射铺得开；手机竖长，自上而下逐行更顺眼
            var d = pc
              ? Math.hypot((c - cx) / cx, (r - cy) / cy) * 0.36
              : r * 0.045 + (c % 3) * 0.02;
            var st = '--d:' + d.toFixed(3) + 's';
            var blink = Math.random() < 0.12;   // 零星几格参与等待呼吸
            if (blink) st += ';--bd:' + (Math.random() * 2).toFixed(2) + 's';
            buf += '<span class="sp-c' + (blink ? ' b' : '') + '" style="' + st + '"></span>';
          }
        }
        grid.innerHTML = buf;

        // 网页拿不到真实加载百分比，只有"好了/没好"一个布尔信号，所以不做假进度条。
        // 最短 950ms 等字标写完（加载太快时闪一下更难看），最长 6s 强制放行——
        // 接口挂了也不能一直遮着人家页面
        var t0 = Date.now(), fired = false, appReady = false, brandReady = false;
        function finish() {
          if (fired) return;
          fired = true;
          setTimeout(function () {
            el.classList.add('sp-out');
            setTimeout(function () {
              window.removeEventListener('resize', handleResize);
              if (window.__wiibSetSplashName) delete window.__wiibSetSplashName;
              if (window.__wiibSplashDone) delete window.__wiibSplashDone;
              if (window.__wiibSplashBrandDone) delete window.__wiibSplashBrandDone;
              el.remove();
            }, 1000);
          }, Math.max(0, 950 - (Date.now() - t0)));
        }
        function finishWhenReady() {
          if (appReady && brandReady) finish();
        }
        window.__wiibSplashDone = function () {
          appReady = true;
          finishWhenReady();
        };
        window.__wiibSplashBrandDone = function () {
          brandReady = true;
          finishWhenReady();
        };
        setTimeout(finish, 6000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
